name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (CLI tests, typecheck, Deno function tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:cli
      - run: npm run test:functions

  deploy-script:
    name: deploy script (Python unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest deployment/prod/test_deploy.py
        env:
          PYTHONUTF8: "1"
