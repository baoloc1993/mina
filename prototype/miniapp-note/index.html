<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mina — prototype Ghi chú (vòng 4)</title>
<style>
/* Token: bản sao đúng DESIGN-SYSTEM.md §2 — nơi DUY NHẤT có giá trị thật */
:root {
  --color-bg: #FFFFFF;
  --color-surface: #F2F4F7;
  --color-text: #111318;
  --color-text-muted: #5B6472;
  --color-primary: #0A5BD3;
  --color-on-primary: #FFFFFF;
  --color-border: #6F7886;
  --color-danger: #C62828;
  --color-success: #1B7A3E;
  --color-warning: #8A5200;
  --color-overlay: #111318;
  --font-sans: system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
  --text-sm: 15px;
  --text-base: 17px;
  --text-lg: 20px;
  --text-xl: 28px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 40px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --shadow: 0 2px 8px rgba(17,19,24,.08);
  --tap-min: 48px;
  --icon-app: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; font-family: var(--font-sans); font-size: var(--text-base); color: var(--color-text); background: var(--color-surface); }
button { font: inherit; cursor: pointer; color: inherit; }
input, select { font: inherit; color: inherit; }
.muted { color: var(--color-text-muted); font-size: var(--text-sm); }
h3 { margin: 0; font-size: var(--text-lg); }
[hidden] { display: none !important; }

/* Trang: khung điện thoại + bảng giả lập */
.page { display: flex; gap: var(--space-lg); justify-content: center; align-items: flex-start; padding: var(--space-lg); flex-wrap: wrap; }
.phone { width: 360px; height: 800px; background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; position: relative; display: flex; flex-direction: column; border: 1px solid var(--color-border); }
.sim { width: 340px; background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--space-md); font-size: var(--text-sm); }
.sim h2 { font-size: var(--text-lg); margin: 0 0 var(--space-sm); }
.sim label { display: flex; align-items: center; gap: var(--space-sm); min-height: 36px; }
.sim fieldset { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin: 0 0 var(--space-sm); padding: var(--space-sm) var(--space-md); }
.sim legend { color: var(--color-text-muted); padding: 0 var(--space-xs); }
.sim .nav { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.sim .nav button, .sim .nav select { padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); font-size: var(--text-sm); min-height: 32px; }
.sim .nav button.on { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
@media (max-width: 600px) {
  .page { padding: 0; gap: 0; }
  .phone { width: 100%; height: 100vh; border-radius: 0; border: 0; }
  .sim { width: 100%; border-radius: 0; }
}

/* Thanh tiêu đề shell (S5) mô phỏng: tên app + chip C6 + nút đóng */
.shellbar { display: flex; align-items: center; gap: var(--space-sm); min-height: 44px; padding: 0 var(--space-md); background: var(--color-surface); font-size: var(--text-sm); font-weight: 600; }
.shellbar .nm { flex: 1; }
.shellbar .x { min-width: 36px; min-height: 36px; border: 0; background: transparent; color: var(--color-text-muted); font-size: var(--text-lg); }
.chip6 { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 28px; padding: 0 var(--space-sm); border-radius: var(--radius-md); border: 1px solid var(--color-border); font-size: var(--text-sm); font-weight: 600; background: var(--color-bg); white-space: nowrap; }
.chip6.ok { color: var(--color-success); }
.chip6.off { color: var(--color-warning); }
.chip6 .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

/* Thanh tiêu đề của app */
.bar { display: flex; align-items: center; gap: var(--space-sm); min-height: 56px; padding: 0 var(--space-md); background: var(--color-bg); }
.bar .title { font-size: var(--text-xl); font-weight: 700; flex: 1; }
.bar .title.small { font-size: var(--text-lg); }
.iconbtn { min-width: var(--tap-min); min-height: var(--tap-min); border: 0; background: transparent; color: var(--color-primary); font-size: var(--text-lg); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; }
.iconbtn[disabled] { opacity: .4; cursor: default; }
.body { flex: 1; overflow: auto; padding: var(--space-md); display: flex; flex-direction: column; gap: var(--space-md); position: relative; }
.body > * { flex-shrink: 0; }
.footer { padding: var(--space-md); background: var(--color-bg); }

/* C1 / C2 nút */
.btn { min-height: var(--tap-min); padding: 0 var(--space-md); border-radius: var(--radius-md); border: 0; background: var(--color-primary); color: var(--color-on-primary); font-weight: 600; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); }
.btn.sec { background: var(--color-bg); color: var(--color-primary); border: 1px solid var(--color-border); }
.btn.danger { background: var(--color-danger); color: var(--color-on-primary); }
.btn.slim { width: auto; min-height: 40px; padding: 0 var(--space-md); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.busy::before { content: ""; width: 18px; height: 18px; border: 2px solid var(--color-on-primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
.btn.sec.busy::before { border-color: var(--color-primary); border-top-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .35; } }

/* C3 ô nhập · C20 ô tìm */
.input { min-height: var(--tap-min); padding: 0 var(--space-md); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg); font-size: var(--text-base); color: var(--color-text); width: 100%; }
.input.err { border-color: var(--color-danger); }
.search { position: relative; }
.search .input { padding-left: 44px; padding-right: 44px; background: var(--color-surface); }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }
.search .clr { position: absolute; right: 0; top: 0; min-width: var(--tap-min); min-height: var(--tap-min); border: 0; background: transparent; color: var(--color-text-muted); font-size: var(--text-lg); }
.errtxt { color: var(--color-danger); font-size: var(--text-sm); }

/* C18 chip tag */
.tags { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
.tags.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: var(--space-xs); }
.tagchip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 36px; padding: 0 var(--space-md); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; color: var(--color-text); }
.tagchip.on { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
.tagchip.mini { min-height: 24px; padding: 0 var(--space-sm); font-weight: 400; color: var(--color-text-muted); }
.tagchip .rm { border: 0; background: transparent; padding: 0 0 0 var(--space-xs); color: var(--color-text-muted); font-size: var(--text-base); min-width: 24px; min-height: 24px; }

/* C19 hàng ghi chú */
.group { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); margin: 0 0 var(--space-xs); }
.notes { display: flex; flex-direction: column; gap: var(--space-sm); }
.note { display: flex; gap: var(--space-sm); width: 100%; text-align: left; background: var(--color-surface); border: 0; border-radius: var(--radius-lg); padding: var(--space-md); min-height: var(--tap-min); }
.note .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-xs); }
.note .ttl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note .snip { color: var(--color-text-muted); font-size: var(--text-sm); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note .when { color: var(--color-text-muted); font-size: var(--text-sm); }
.note .pin { color: var(--color-primary); flex: none; }
.note.trash .ttl { color: var(--color-text-muted); }
.note .left { color: var(--color-text-muted); font-size: var(--text-sm); }
.note .left.soon { color: var(--color-warning); font-weight: 600; }
.note .side { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-sm); flex: none; }
mark { background: transparent; color: var(--color-primary); text-decoration: underline; font-weight: 700; }
.row { display: flex; gap: var(--space-sm); align-items: center; }
.link { background: transparent; border: 0; color: var(--color-primary); font-size: var(--text-sm); min-height: 36px; padding: 0; text-align: left; }

/* C8 banner */
.banner { display: flex; gap: var(--space-sm); align-items: center; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: var(--color-surface); border-left: 4px solid var(--color-primary); font-size: var(--text-sm); }
.banner.warn { border-left-color: var(--color-warning); color: var(--color-warning); }
.banner.err { border-left-color: var(--color-danger); color: var(--color-danger); }
.banner.info { color: var(--color-primary); }
.banner span { flex: 1; }
.banner .btn { width: auto; min-height: 36px; padding: 0 var(--space-sm); font-size: var(--text-sm); }
.banner .prog { height: 6px; flex: 1; border-radius: var(--radius-md); background: var(--color-bg); border: 1px solid var(--color-border); overflow: hidden; }
.banner .prog i { display: block; height: 100%; background: var(--color-primary); }

/* C13 khuôn rỗng / lỗi / đang tải */
.empty { text-align: center; padding: var(--space-xl) var(--space-md); display: flex; flex-direction: column; align-items: center; gap: var(--space-md); color: var(--color-text-muted); }
.empty .big { font-size: 56px; line-height: 1; opacity: .5; }
.empty .btn { width: auto; }
.empty.err { color: var(--color-danger); }
.skel { display: flex; flex-direction: column; gap: var(--space-sm); }
.skel div { height: 84px; border-radius: var(--radius-lg); background: var(--color-surface); animation: blink 1.2s infinite; }

/* C23 vùng soạn · C17 thanh công cụ · C21 checklist · C22 đính kèm */
.ttlinput { border: 0; outline: 0; font-size: var(--text-lg); font-weight: 700; width: 100%; min-height: var(--tap-min); padding: 0; background: transparent; color: var(--color-text); }
.editor { min-height: 200px; outline: 0; line-height: 1.5; flex: 1; }
.editor:empty::before { content: attr(data-ph); color: var(--color-text-muted); }
.editor h2 { font-size: var(--text-lg); margin: var(--space-sm) 0; }
.editor p { margin: 0 0 var(--space-sm); }
.editor ul, .editor ol { margin: 0 0 var(--space-sm); padding-left: var(--space-lg); }
.editor a { color: var(--color-primary); }
.cl { display: flex; align-items: center; gap: var(--space-sm); min-height: var(--tap-min); }
.cl .box { width: 24px; height: 24px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-sm); line-height: 1; color: var(--color-on-primary); }
.cl.done .box { background: var(--color-primary); border-color: var(--color-primary); }
.cl.done .tx { text-decoration: line-through; color: var(--color-text-muted); }
.cl .tx { flex: 1; outline: 0; }
.savebar { color: var(--color-text-muted); font-size: var(--text-sm); flex: 1; text-align: center; }
.savebar.busy { color: var(--color-primary); }
.toolbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: var(--space-xs); padding: var(--space-xs) var(--space-sm); background: var(--color-bg); border-top: 1px solid var(--color-border); overflow-x: auto; }
.toolbar button { min-width: var(--tap-min); min-height: var(--tap-min); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text); font-weight: 700; }
.toolbar button.on { background: var(--color-primary); color: var(--color-on-primary); }
.toolbar button[disabled] { opacity: .4; cursor: default; }
.atts { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
.att { position: relative; display: inline-flex; align-items: center; gap: var(--space-sm); min-height: 64px; padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-xs); background: var(--color-surface); border-radius: var(--radius-md); font-size: var(--text-sm); }
.att .thumb { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.att .thumb.pdf { background: var(--color-danger); }
.att .nm { font-weight: 600; display: block; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .wait { width: 10px; height: 10px; border-radius: 50%; background: var(--color-warning); }
.att .rm { border: 0; background: transparent; color: var(--color-text-muted); font-size: var(--text-lg); min-width: 32px; min-height: 32px; }
.addrow { display: flex; gap: var(--space-sm); }
.addrow .btn { flex: 1; }

/* Menu ⋯ */
.menu { position: absolute; right: var(--space-md); top: 112px; z-index: 5; background: var(--color-bg); border-radius: var(--radius-md); box-shadow: var(--shadow); border: 1px solid var(--color-border); min-width: 220px; overflow: hidden; }
.menu button { display: block; width: 100%; text-align: left; min-height: var(--tap-min); padding: 0 var(--space-md); border: 0; background: transparent; }
.menu button.dg { color: var(--color-danger); }

/* C9 hộp thoại · C24 sheet · C10 toast */
.scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--color-overlay) 45%, transparent); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.scrim.mid { align-items: center; padding: var(--space-md); }
.dialog { background: var(--color-bg); border-radius: var(--radius-lg); padding: var(--space-md); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--space-md); width: 100%; }
.sheet { background: var(--color-bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--space-md); box-shadow: var(--shadow); width: 100%; display: flex; flex-direction: column; gap: var(--space-md); max-height: 80%; overflow: auto; }
.pick { display: flex; align-items: center; gap: var(--space-md); min-height: var(--tap-min); width: 100%; border: 0; background: transparent; text-align: left; }
.pick .box { width: 24px; height: 24px; border: 2px solid var(--color-border); border-radius: var(--radius-md); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--color-on-primary); font-size: var(--text-sm); }
.pick.on .box { background: var(--color-primary); border-color: var(--color-primary); }
.toast { position: absolute; left: var(--space-md); right: var(--space-md); bottom: 84px; z-index: 20; display: flex; gap: var(--space-sm); align-items: center; background: var(--color-text); color: var(--color-bg); border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md); font-size: var(--text-sm); box-shadow: var(--shadow); }
.toast span { flex: 1; }
.toast.err { background: var(--color-danger); color: var(--color-on-primary); }
.toast button { border: 0; background: transparent; color: var(--color-bg); font-weight: 700; text-decoration: underline; min-height: 36px; }
.toast.err button { color: var(--color-on-primary); }
.shelltoast { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); }
.shelltoast button { color: var(--color-primary); }
</style>
</head>
<body>
<div class="page">
  <div class="phone" id="phone">
    <div class="shellbar" aria-label="Thanh tiêu đề shell (S5)">
      <span class="nm">Ghi chú</span>
      <span class="chip6 ok" id="chip6"><i class="dot"></i><span id="chip6t">Đã đồng bộ</span></span>
      <button class="x" aria-label="Đóng app">×</button>
    </div>
    <div id="screen" style="display:flex;flex-direction:column;flex:1;min-height:0;position:relative"></div>
  </div>

  <div class="sim">
    <h2>Giả lập</h2>
    <p class="muted">Bấm thử như P1: gõ ghi chú, tìm "ghi chu", gắn tag, xoá rồi khôi phục. Các nút dưới đây thay cho thứ khó bấm tay (máy thứ hai, intent, mất mạng).</p>
    <fieldset><legend>Màn hình</legend>
      <div class="nav" id="nav">
        <button data-go="S11">S11 Danh sách</button>
        <button data-go="S12">S12 Soạn</button>
        <button data-go="S13">S13 Thùng rác</button>
        <button data-go="S14">S14 Gắn tag</button>
      </div>
    </fieldset>
    <fieldset><legend>Trạng thái</legend>
      <label><input type="checkbox" id="simOffline"> Mất mạng (offline)</label>
      <label><input type="checkbox" id="simRO"> Chỉ đọc (quá ân hạn)</label>
      <label><input type="checkbox" id="simClean"> DB sạch (chưa có ghi chú)</label>
      <div class="nav"><button id="simNewDevice">Máy mới đang tải từ máy chủ</button></div>
    </fieldset>
    <fieldset><legend>Hai máy (AC-2)</legend>
      <div class="nav">
        <button id="simB">Máy B sửa cùng note</button>
        <button id="simBTitle">Máy B đổi tiêu đề</button>
        <button id="simCompact">Gộp 203 update</button>
      </div>
      <p class="muted">Mở một ghi chú ở S12 rồi bấm.</p>
    </fieldset>
    <fieldset><legend>Intent (từ Hello)</legend>
      <div class="nav">
        <button id="itCreate">note.create</button>
        <button id="itOpenOk">note.open (id thật)</button>
        <button id="itOpenNone">note.open (id lạ)</button>
        <button id="itOpenTrash">note.open (thùng rác)</button>
        <button id="itBad">payload sai</button>
      </div>
    </fieldset>
    <fieldset><legend>Đính kèm &amp; thùng rác</legend>
      <label>Quyền ảnh
        <select id="simPerm"><option value="allow">Cho phép</option><option value="deny">Từ chối</option></select>
      </label>
      <label>Tệp chọn
        <select id="simFile"><option value="pdf">PDF hợp lệ</option><option value="docx">tệp .docx</option><option value="big">PDF 60 MB</option></select>
      </label>
      <div class="nav"><button id="simExpire">Quá 30 ngày (job server)</button></div>
    </fieldset>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* ---------- tiện ích ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function normChar(c) { return c.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase(); }
  function norm(s) { var o = ''; for (var i = 0; i < s.length; i++) o += normChar(s[i]); return o.replace(/\s+/g, ' ').trim(); }
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html.replace(/<\/(p|div|li|h2)>/g, ' </$1>'); return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
  function highlight(str, terms) {
    if (!terms.length) return esc(str);
    var out = '', map = [];
    for (var i = 0; i < str.length; i++) { var n = normChar(str[i]); for (var k = 0; k < n.length; k++) { out += n[k]; map.push(i); } }
    var mk = new Array(str.length).fill(false);
    terms.forEach(function (t) { var from = 0; for (;;) { var p = out.indexOf(t, from); if (p < 0) break; for (var j = p; j < p + t.length; j++) mk[map[j]] = true; from = p + t.length; } });
    var r = '', open = false;
    for (var x = 0; x < str.length; x++) { if (mk[x] && !open) { r += '<mark>'; open = true; } if (!mk[x] && open) { r += '</mark>'; open = false; } r += esc(str[x]); }
    return r + (open ? '</mark>' : '');
  }
  var ICON_SEARCH = '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
  var ICON_PIN = '<svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-label="Đã ghim"><path d="M14 3l7 7-3 1-3 3 1 5-2 2-4-6-6 6-1-1 6-6-6-4 2-2 5 1 3-3z"/></svg>';

  /* ---------- dữ liệu giả (PRD §7) ---------- */
  var uid = 100;
  var tagsAll = ['việc nhà', 'mua sắm', 'công việc', 'ý tưởng'];
  var notes, trash, state;
  function seed() {

    else if (act === 'addfile') {
      var k = document.getElementById('simFile').value;
      if (k !== 'pdf') { toast('Chỉ đính được tệp PDF nhỏ hơn 50 MB. (INVALID_REQUEST)', { err: true }); return; }
      n.files.push({ kind: 'pdf', name: 'tai-lieu-' + (++uid) + '.pdf', size: '340 KB', pending: state.offline }); touch(); render();
    }
  });

  /* ---------- bảng Giả lập ---------- */
  function $(id) { return document.getElementById(id); }
  $('simOffline').addEventListener('change', function (e) { state.offline = e.target.checked; if (!state.offline) notes.concat(trash).forEach(function (x) { x.files.forEach(function (f) { f.pending = false; }); }); render(); });
  $('simRO').addEventListener('change', function (e) { state.ro = e.target.checked; render(); });
  $('simClean').addEventListener('change', function (e) { state.clean = e.target.checked; render(); });
  $('simNewDevice').addEventListener('click', function () {
    state.clean = true; $('simClean').checked = true; state.loading = 1; state.screen = 'S11'; render();
    var iv = setInterval(function () { state.loading += 3; if (state.loading >= 30) { clearInterval(iv); state.loading = 0; state.clean = false; $('simClean').checked = false; toast('Đã tải xong 30 ghi chú'); } if (state.screen === 'S11') render(); }, 250);
  });
  $('simB').addEventListener('click', function () {
    var n = find(state.cur); if (state.screen !== 'S12' || !n || inTrash(n)) { toast('Mở một ghi chú ở S12 trước'); return; }
    var ed = $('ed'); if (ed) n.body = ed.innerHTML;
    n.body += '<p>— (máy B, lúc mất mạng) Nhớ mua thêm sữa chua và trứng.</p>'; state.banner = 'Đã hợp nhất thay đổi từ máy khác — chữ của cả hai máy đều còn.'; render();
  });
  $('simBTitle').addEventListener('click', function () {
    var n = find(state.cur); if (state.screen !== 'S12' || !n) { toast('Mở một ghi chú ở S12 trước'); return; }
    n.title = n.title + ' (máy B)'; state.banner = 'Tiêu đề được máy khác đổi sau cùng — giữ bản tới sau.'; render();
  });
  $('simCompact').addEventListener('click', function () {
    if (state.screen !== 'S12') { toast('Mở một ghi chú ở S12 trước'); return; }
    state.compacting = true; var s = $('savebar'); if (s) { s.textContent = saveText(); s.className = 'savebar busy'; }
    setTimeout(function () { state.compacting = false; var s2 = $('savebar'); if (s2) { s2.textContent = saveText(); s2.className = 'savebar'; } toast('Đã gộp 203 bản cập nhật — nội dung không đổi'); }, 1500);
  });
  function shellToast() { toast('Đã gửi tới Ghi chú · Mở?', { shell: true, label: 'Mở', act: function () { openNote('n-intent'); } }); }
  $('itCreate').addEventListener('click', function () {
    if (!find('n-intent')) notes.unshift({ id: 'n-intent', title: 'Bài báo: Giá xăng điều chỉnh từ chiều nay', pinned: false, tags: [], when: 'Vừa xong', files: [], body: '<p>Tóm tắt: giá xăng giảm nhẹ ở kỳ điều hành này.</p><p><a href="#S11">https://vnexpress.net/bai-bao-gia-xang</a></p>' });
    state.screen = 'S11'; location.hash = 'S11'; render(); shellToast();
  });
  $('itOpenOk').addEventListener('click', function () { openNote(notes[0].id); });
  $('itOpenNone').addEventListener('click', function () { state.cur = 'xxx'; state.err = 'NOT_FOUND'; state.screen = 'S12'; location.hash = 'S12'; render(); });
  $('itOpenTrash').addEventListener('click', function () {
    var tn = trash[0]; if (!tn) { toast('Thùng rác đang trống'); return; }
    state.cur = tn.id; state.screen = 'S12'; location.hash = 'S12';
    state.dialog = { title: 'Ghi chú này đang ở thùng rác', text: 'Khôi phục để sửa lại, hoặc chỉ xem.', btns: [{ id: 'view', label: 'Chỉ xem', cls: 'sec' }, { id: 'restore', label: 'Khôi phục' }], on: function (id) { if (id === 'restore') { trash = trash.filter(function (x) { return x !== tn; }); tn.when = 'Vừa khôi phục'; notes.unshift(tn); toast('Đã khôi phục ghi chú'); } } };
    render();
  });
  $('itBad').addEventListener('click', function () { toast('Dữ liệu gửi sang Ghi chú không hợp lệ. (INTENT_REJECTED)', { err: true }); });
  $('simExpire').addEventListener('click', function () {
    var before = trash.length; trash = trash.filter(function (x) { return x.left > 3; });
    toast(before > trash.length ? (before - trash.length) + ' ghi chú đã xoá hẳn (quá 30 ngày)' : 'Không có ghi chú nào quá hạn'); render();
  });
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.addEventListener('click', function () {}); });

  var h0 = (location.hash || '').replace('#', '');
  if (/^S1[1-4]$/.test(h0)) { if (h0 === 'S14') { state.cur = notes[0].id; state.screen = 'S12'; state.sheet = true; } else if (h0 === 'S12') { state.cur = notes[0].id; state.screen = 'S12'; } else state.screen = h0; }
  render();
})();
</script>
</body>
</html>
