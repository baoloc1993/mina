# FILE SINH bởi `npm run registry -- gen-sync-rules` từ app_tables × installations — KHÔNG sửa tay (sửa scripts/lib/syncrules.ts).
# Mỗi app một bucket: thiết bị chỉ kéo bảng của app mà tenant đã cài và bật (installations.enabled).
# Gỡ app → ngừng kéo; dữ liệu server giữ nguyên. Không bao giờ lọc theo giá trị client gửi — chỉ theo claim đã ký.
bucket_definitions:
  installations:
    parameters: select request.jwt() ->> 'tenant_id' as tenant_id
    data:
      - select app_id as id, app_id, tenant_id, version, enabled, position, installed_at, updated_at from installations where tenant_id = bucket.tenant_id
  rejections:
    parameters: select request.jwt() ->> 'tenant_id' as tenant_id
    data:
      - select * from sync_rejections where tenant_id = bucket.tenant_id
  core:
    parameters: select request.jwt() ->> 'tenant_id' as tenant_id
    data:
      - select * from core_contacts where tenant_id = bucket.tenant_id
      - select * from core_files where tenant_id = bucket.tenant_id
      - select * from core_tags where tenant_id = bucket.tenant_id
  app_hello:
    parameters: select tenant_id from installations where tenant_id = request.jwt() ->> 'tenant_id' and app_id = 'vn.app.hello' and enabled = true
    data:
      - select * from app_hello_drafts where tenant_id = bucket.tenant_id
      - select * from app_hello_items where tenant_id = bucket.tenant_id
  app_vn_app_hello_b:
    parameters: select tenant_id from installations where tenant_id = request.jwt() ->> 'tenant_id' and app_id = 'vn.app.hello-b' and enabled = true
    data:
      - select * from app_vn_app_hello_b_drafts where tenant_id = bucket.tenant_id
      - select * from app_vn_app_hello_b_items where tenant_id = bucket.tenant_id
  app_vn_app_hello_cal:
    parameters: select tenant_id from installations where tenant_id = request.jwt() ->> 'tenant_id' and app_id = 'vn.app.hello-cal' and enabled = true
    data:
      - select * from app_vn_app_hello_cal_reminders where tenant_id = bucket.tenant_id
  app_vn_app_note:
    parameters: select tenant_id from installations where tenant_id = request.jwt() ->> 'tenant_id' and app_id = 'vn.app.note' and enabled = true
    data:
      - select * from app_vn_app_note_note_blocks where tenant_id = bucket.tenant_id
      - select * from app_vn_app_note_note_files where tenant_id = bucket.tenant_id
      - select * from app_vn_app_note_note_tags where tenant_id = bucket.tenant_id
      - select * from app_vn_app_note_notes where tenant_id = bucket.tenant_id
  app_vn_app_private_a:
    parameters: select tenant_id from installations where tenant_id = request.jwt() ->> 'tenant_id' and app_id = 'vn.app.private-a' and enabled = true
    data:
      - select * from app_vn_app_private_a_notes where tenant_id = bucket.tenant_id
