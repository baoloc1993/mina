# PowerSync Open Edition — cấu hình local (vòng 1). Giá trị bí mật lấy từ env, không ghi ở đây.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable
storage:
  type: mongodb
  uri: !env PS_MONGO_URI
port: 8080
sync_rules:
  path: /config/sync-rules.yaml
client_auth:
  # Xác thực JWT của Supabase Auth (HS256 local). Vòng 7 đổi sang JWKS của Supabase Cloud.
  supabase: true
  supabase_jwt_secret: !env PS_SUPABASE_JWT_SECRET
  audience: ["authenticated"]
