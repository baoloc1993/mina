<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 0 12px 96px; background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 12px 0 8px; }
  /* Thanh nhập cố định: danh sách dài vẫn thêm được mà không phải cuộn về đầu */
  #bar { position: sticky; top: 0; z-index: 2; background: #fff; padding: 8px 0; border-bottom: 1px solid #ddd; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-height: 44px; padding: 0 12px; font-size: 16px; border: 1px solid #767676; border-radius: 6px; }
  button { min-height: 44px; min-width: 44px; padding: 0 14px; font-size: 14px; border: 1px solid #333; border-radius: 6px; background: #eee; color: #000; }
  button.primary { background: #1565C0; border-color: #1565C0; color: #fff; font-weight: 700; }
  button.danger { background: #fff; border-color: #B00020; color: #B00020; }
  button.danger.armed { background: #B00020; color: #fff; }
  #toast { min-height: 20px; margin-top: 6px; font-size: 13px; color: #374151; }
  ul { list-style: none; padding: 0; margin: 0 0 12px; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #ddd; min-height: 56px; }
  li span { flex: 1; word-break: break-word; font-size: 16px; }
  li.done span { text-decoration: line-through; color: #555; }
  li .gap { width: 16px; flex: none; }
  #empty { color: #555; }
  #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; background: #f4f4f4; padding: 8px; border-radius: 6px; min-height: 44px; }
  details { margin-top: 12px; }
  .cases { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <input id="title" placeholder="Thêm mục mới" autocomplete="off" enterkeyhint="send">
    <button id="add" class="primary">Thêm</button>
  </div>
  <div id="toast" aria-live="polite"></div>
</div>
<h1>Hello — mini app thử</h1>
<p id="empty" hidden>Chưa có mục nào</p>
<ul id="list"></ul>

<details open>
  <summary>Ca phá bridge (AC-6)</summary>
  <div class="cases">
    <button data-case="a">(a) bảng không khai</button>
    <button data-case="b">(b) SQL hỏng</button>
    <button data-case="c1">(c) ATTACH</button>
    <button data-case="c2">(c) PRAGMA</button>
    <button data-case="c3">(c) DROP</button>
    <button data-case="d">(d) notify.*</button>
    <button data-case="e">(e) fetch</button>
    <button data-case="ok">SQL hợp lệ</button>
    <button data-case="token">getAppToken</button>
  </div>
</details>
<div id="log"></div>

<script>
(function () {
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var logEl = document.getElementById('log');
  var titleEl = document.getElementById('title');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function log(msg) { logEl.textContent = msg + '\n' + logEl.textContent.slice(0, 1500); }
  function toast(msg) {
    toastEl.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.textContent = ''; }, 3000);
  }
  function uuid() { return crypto.randomUUID(); }

  var armed = null; // nút Xoá đang chờ bấm lần hai
  function disarm() { if (armed) { armed.btn.textContent = 'Xoá'; armed.btn.classList.remove('armed'); clearTimeout(armed.t); armed = null; } }

  function render(rows) {
    disarm();
    listEl.innerHTML = '';
    emptyEl.hidden = rows.length > 0;
    rows.forEach(function (r) {
      var li = document.createElement('li');
      if (r.done) li.className = 'done';
      var span = document.createElement('span'); span.textContent = r.title;
      var tog = document.createElement('button'); tog.textContent = r.done ? 'Bỏ xong' : 'Xong';
      tog.onclick = function () {
        window.miniapp.db.execute('UPDATE items SET done = ? WHERE id = ?', [r.done ? 0 : 1, r.id]).then(refresh);
      };
      var gap = document.createElement('span'); gap.className = 'gap';
      var del = document.createElement('button'); del.textContent = 'Xoá'; del.className = 'danger';
      // Xoá phải bấm hai lần (không có hoàn tác): lần đầu chỉ "lên đạn" trong 3 giây
      del.onclick = function () {
        if (armed && armed.btn === del) {
          disarm();
          window.miniapp.db.execute('DELETE FROM items WHERE id = ?', [r.id]).then(function () { toast('Đã xoá "' + r.title + '"'); return refresh(); });
          return;
        }
        disarm();
        del.textContent = 'Chắc không?'; del.classList.add('armed');
        armed = { btn: del, t: setTimeout(disarm, 3000) };
      };
      li.appendChild(span); li.appendChild(tog); li.appendChild(gap); li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  function refresh() {
    // Mới nhất lên đầu; id làm khoá phụ để thứ tự ổn định khi trùng thời điểm tạo
    return window.miniapp.db
      .query('SELECT id, title, done FROM items WHERE deleted_at IS NULL ORDER BY created_at DESC, id', [])
      .then(function (rows) { if (armed) return; render(rows); }) // đang chờ xác nhận Xoá: đừng vẽ lại làm mất nút
      .catch(function (e) { log('[query] lỗi: ' + e.code + ' — ' + e.message); });
  }

  function addItem() {
    var t = titleEl.value.trim();
    if (!t) return;
    var t0 = performance.now();
    window.miniapp.db.execute('INSERT INTO items (id, title, done) VALUES (?, ?, ?)', [uuid(), t, 0])
      .then(refresh)
      .then(function () {
        var ms = Math.round(performance.now() - t0);
        toast('Đã thêm "' + t + '"');
        log('[thêm] xong sau ' + ms + ' ms');
        window.scrollTo(0, 0);
      });
    titleEl.value = '';
  }
  document.getElementById('add').onclick = addItem;
  titleEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

  // Khuôn log thống nhất: "[ca] bị chặn: MÃ — mô tả" / "[ca] chạy được: …"
  function expectReject(name, p) {
    p.then(function () { log('[' + name + '] KHÔNG BỊ CHẶN — LỖI!'); })
     .catch(function (e) {
       var code = e.code || (e.name === 'TypeError' ? 'CSP_BLOCKED' : e.name);
       var desc = e.code ? e.message : 'shell chặn mọi kết nối mạng trực tiếp từ mini app (CSP connect-src none)';
       log('[' + name + '] bị chặn: ' + code + ' — ' + desc);
     });
  }
  var m = window.miniapp;
  var cases = {
    a: function () { expectReject('a', m.db.query('SELECT * FROM secrets', [])); },
    b: function () { expectReject('b', m.db.execute('SELEC * FRM items', [])); },
    c1: function () { expectReject('c-attach', m.db.execute("ATTACH DATABASE 'x.db' AS x", [])); },
    c2: function () { expectReject('c-pragma', m.db.execute('PRAGMA key = 1', [])); },
    c3: function () { expectReject('c-drop', m.db.execute('DROP TABLE items', [])); },
    d: function () { expectReject('d', m.call('notify.local', { title: 'x' })); },
    e: function () { expectReject('e', fetch('http://10.0.2.2:54321/rest/v1/')); },
    ok: function () {
      m.db.query('SELECT COUNT(*) AS n FROM items WHERE deleted_at IS NULL', [])
        .then(function (r) { log('[sql hợp lệ] chạy được: ' + JSON.stringify(r)); });
    },
    token: function () {
      m.auth.getAppToken().then(function (t) { log('[token] chạy được: ' + t.token.slice(0, 20) + '… hết hạn ' + t.expires_at); })
       .catch(function (e) { log('[token] bị chặn: ' + e.code + ' — ' + e.message); });
    }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-case]'), function (b) {
    b.onclick = cases[b.getAttribute('data-case')];
  });

  refresh().then(function () { return m.sdk.ready(); });
  setInterval(refresh, 1500); // thấy thay đổi từ máy khác sau khi sync
})();
</script>
</body>
</html>
