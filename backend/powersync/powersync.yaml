# PowerSync Open Edition — cấu hình local (vòng 1). Giá trị bí mật lấy từ env, không ghi ở đây.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable
storage:
  type: mongodb
  uri: !env PS_MONGO_URI
port: 8080
sync_rules:
  path: /config/sync-rules.yaml
client_auth:
  # Supabase CLI mới ký JWT bằng ES256 (khoá bất đối xứng) → xác thực qua JWKS, không dùng secret HS256.
  # Vòng 7 (Supabase Cloud) đổi uri sang https://<project>.supabase.co/auth/v1/.well-known/jwks.json
  jwks_uri: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
  audience: ["authenticated"]
